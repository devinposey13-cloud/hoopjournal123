<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Cache control to ensure fresh content -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <script defer data-id="wgNJVVsyiqGRYkyA5Kjx" src="https://progressier.app/wgNJVVsyiqGRYkyA5Kjx/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-wc@0.8.11/dist/dotlottie-wc.js" type="module"></script>
    <link rel="manifest" href="https://progressier.app/wgNJVVsyiqGRYkyA5Kjx/progressier.json" />
    <title>Hoop Journal™</title>
    <meta name="description" content="Track your basketball stats, games, and highlights with Hoop Journal™" />
    <meta name="author" content="Hoop Journal™" />

    <meta property="og:title" content="Hoop Journal™" />
    <meta property="og:description" content="Track your basketball stats, games, and highlights" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <!-- Google Fonts - Dancing Script for journal cursive + Teko for athletic headers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Apple Sign In JS SDK (for native iOS/Web Apple Sign In) -->
    <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
  </head>

  <body>
    <!-- Pre-hydration loading shell: dark bg prevents white flash on iOS native -->
    <div id="prehydration-shell" style="position:fixed;inset:0;z-index:9999;background:#141a23;display:flex;align-items:center;justify-content:center;flex-direction:column;">
      <div style="filter:drop-shadow(0 0 20px rgba(255,140,50,0.4)) drop-shadow(0 0 40px rgba(255,140,50,0.2));">
        <dotlottie-wc src="https://lottie.host/dc3b3b08-d2bb-46f0-915d-c8d56d0dd2c1/lCHnsbvgB8.lottie" style="width:200px;height:200px;" autoplay loop></dotlottie-wc>
      </div>
      <div id="shell-msg" style="color:#888;font-size:14px;font-family:system-ui;margin-top:16px;transition:opacity 0.3s ease;"></div>
      <script>
        (function(){
          var isCallback = window.location.pathname==='/auth/callback';
          var isPostAuth = window.location.search.indexOf('postAuth')!==-1;
          var isAuthFlow = isCallback || isPostAuth;
          var msg = document.getElementById('shell-msg');
          if(isAuthFlow && msg){
            msg.textContent='Signing you in\u2026';
            window.__shellTimers=[];
            window.__shellTimers.push(setTimeout(function(){ if(msg) msg.textContent='Still working\u2026'; },5000));
            window.__shellTimers.push(setTimeout(function(){ if(msg) msg.textContent='Almost there\u2026'; },10000));
          }
          window.__dismissShell=function(){
            if(window.__shellTimers){window.__shellTimers.forEach(clearTimeout);window.__shellTimers=null;}
            if(window.__shellFallback){clearTimeout(window.__shellFallback);window.__shellFallback=null;}
            var s=document.getElementById('prehydration-shell');
            if(s){s.style.transition='opacity 0.3s ease';s.style.opacity='0';setTimeout(function(){s.remove()},300);}
          };
          // Safety fallback: dismiss shell after 15s no matter what
          window.__shellFallback=setTimeout(function(){ window.__dismissShell&&window.__dismissShell(); },15000);
        })();
      </script>
    </div>
    <div id="root"></div>
    <script>
      // Ensure OAuth callback routes bypass service worker cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function(event) {
          if (event.data && event.data.type === 'SKIP_WAITING') {
            event.source.postMessage({ type: 'CLIENTS_CLAIM' });
          }
        });
        // On OAuth callback paths or token-bearing URLs, unregister SW to prevent caching
        var hash = window.location.hash || '';
        var hasOAuthTokens = hash.includes('access_token') || hash.includes('refresh_token');
        var isCallbackRoute = window.location.pathname === '/auth/callback';
        if (window.location.pathname.startsWith('/~oauth') || hasOAuthTokens || isCallbackRoute) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) {
              registration.unregister().then(function() {
                if (!hasOAuthTokens) {
                  window.location.reload();
                }
              });
            });
          });
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
